# Schneider Electric D-Life icons: the 54 the "Push Button Dynamic Labelling" display
# can show (ETS app 1871, "Icon for status on/off"; `ets` is the parameter value),
# plus one insert-only icon (message) that the Pro T push-button inserts carry.
#
# `file` is the picture's name inside Schneider's ETS product data
# (M-0064/Baggages/Icon_Product_preview.zip in a .knxproj). The pictures are
# Schneider's and are not in this repository: `tools/schneider_icons.py` copies
# them from your own project file into Home Assistant, and the page uses them
# when they are there. `mdi` is the look-alike shown when they aren't.
